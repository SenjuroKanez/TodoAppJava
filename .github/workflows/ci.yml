name: TodoApp checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp -Pproduction,integration verify
      - run: npm run typecheck && npm test
      - run: npx playwright install --with-deps chromium
      - run: DATABASE_PASSWORD=ci-only-password COOKIE_SECURE=false docker compose up --build -d --wait
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            playwright-report
      - if: always()
        run: DATABASE_PASSWORD=ci-only-password docker compose down
