spring.application.name=todoapp
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/todoapp}
spring.datasource.username=${DATABASE_USER:todoapp}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.enabled=true
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
app.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.vapid.subject=${VAPID_SUBJECT:mailto:admin@example.com}
spring.sql.init.mode=never
logging.level.com.todoapp=INFO
